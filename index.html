<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Ventas — Acceso</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #f8fafc;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
  }
  .brand {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #0ea5e9;
    margin-bottom: 8px;
  }
  h1 {
    margin: 0 0 6px 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .subtitle {
    margin: 0 0 28px 0;
    color: #64748b;
    font-size: 13px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #475569;
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    color: #0f172a;
    background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s;
    margin-bottom: 16px;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: #0ea5e9;
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
  }
  button {
    width: 100%;
    padding: 11px 16px;
    background: #0f172a;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #1e293b; }
  button:disabled { background: #94a3b8; cursor: wait; }
  .error {
    margin-top: 14px;
    padding: 10px 12px;
    background: #fee2e2;
    color: #b91c1c;
    border-radius: 6px;
    font-size: 12.5px;
    display: none;
  }
  .error.show { display: block; }
  .footer {
    margin-top: 24px;
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
  }
  .lock-icon {
    width: 36px;
    height: 36px;
    background: #e0f2fe;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    color: #0284c7;
    font-size: 18px;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <div class="brand">NOVIT · SHARKY</div>
    <h1>Dashboard de Ventas</h1>
    <p class="subtitle">Ingresa tu contraseña para acceder al pipeline comercial.</p>
    <form id="loginForm">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" autofocus required>
      <button type="submit" id="submitBtn">Acceder</button>
      <div class="error" id="error"></div>
    </form>
    <div class="footer">Acceso protegido · AES-256-GCM</div>
  </div>

const PBKDF2_ITERATIONS = 250000;

async function decryptDashboard(password) {
  const blob = Uint8Array.from(atob(ENCRYPTED_BLOB), c => c.charCodeAt(0));
  const salt = blob.slice(0, 16);
  const iv = blob.slice(16, 28);
  const ciphertext = blob.slice(28);

  const baseKey = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );

  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );

  const plaintext = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv },
    key,
    ciphertext
  );

  return new TextDecoder().decode(plaintext);
}

const form = document.getElementById("loginForm");
const passwordEl = document.getElementById("password");
const errorEl = document.getElementById("error");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = passwordEl.value;
  errorEl.classList.remove("show");
  submitBtn.disabled = true;
  submitBtn.textContent = "Desencriptando…";

  try {
    const html = await decryptDashboard(password);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    submitBtn.disabled = false;
    submitBtn.textContent = "Acceder";
    errorEl.textContent = "Contraseña incorrecta. Intenta nuevamente.";
    errorEl.classList.add("show");
    passwordEl.value = "";
    passwordEl.focus();
  }
});
</script>
